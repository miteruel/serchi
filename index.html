<!doctype html>
<html lang="eo">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Serĉilo - Esperanto Search Engine · Liberanimo Teruel</title>
    <link rel="icon" href="/logo-liberanimo.jpg" type="image/jpeg" />
    <meta name="author" content="Liberanimo Teruel" />
    <meta name="description" content="Rapida, minimalisma serĉilo por malkovri kursojn, projektojn, novaĵojn, literaturon kaj ilojn en Esperanto laŭ lingva nivelo kaj temoj." />
    <!-- __SITE_URL__ is replaced by the server with the site's address (SITE_URL) -->
    <link rel="canonical" href="__SITE_URL__/" />
    <meta property="og:site_name" content="Serĉilo · Liberanimo Teruel" />
    <meta property="og:title" content="Serĉilo - Esperanto Search Engine" />
    <meta property="og:description" content="Rapida, minimalisma serĉilo por malkovri kursojn, projektojn, novaĵojn, literaturon kaj ilojn en Esperanto laŭ lingva nivelo kaj temoj." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="eo" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="__SITE_URL__/og-image.png" />
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Serĉilo",
      "url": "__SITE_URL__/",
      "inLanguage": ["eo", "es", "en"],
      "publisher": { "@type": "Organization", "name": "Liberanimo Teruel" },
      "potentialAction": {
        "@type": "SearchAction",
        "target": "__SITE_URL__/?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
