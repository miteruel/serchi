@LayoutPage layout.html
<section class="flex-1 flex flex-col items-center justify-center px-4 py-16 max-w-3xl mx-auto w-full">
  <div class="flex flex-col items-center mb-8 select-none">
    <img src="/static/logo-liberanimo.jpg" alt="Liberanimo Teruel" class="w-24 h-24 mb-3 rounded-2xl object-contain">
    <h1 class="text-6xl font-bold tracking-tight">
      <span class="text-emerald-600">S</span><span class="text-blue-600">e</span><span class="text-red-500">r</span><span class="text-amber-500">ĉ</span><span class="text-emerald-600">i</span><span class="text-blue-600">l</span><span class="text-red-500">o</span>
    </h1>
    <p class="mt-3 text-gray-500 dark:text-gray-400 text-center">@t.tagline</p>
    <p class="mt-1 text-sm font-semibold text-emerald-700 dark:text-emerald-400">@t.ownerNotice</p>
  </div>

  <form action="/search" method="get" class="w-full">
    <div class="flex items-center w-full rounded-full border border-gray-300 dark:border-gray-600 dark:bg-[#303134] px-5 py-3 shadow-sm hover:shadow-md focus-within:shadow-md">
      <span class="text-gray-400 mr-3">🔎</span>
      <input id="q" type="search" name="q" autofocus data-xsystem
             placeholder="@t.searchPlaceholder" aria-label="@t.screenReaderSearchInput"
             class="flex-1 bg-transparent outline-none text-base">
    </div>

    <div class="mt-5 text-center">
      <p class="text-sm text-gray-500 mb-2">@t.quickFilters</p>
      <div class="flex flex-wrap justify-center gap-2">
        @ForEach (var o in Model.LevelOptions) {
        <label class="cursor-pointer">
          <input type="radio" name="level" value="@o.Value" class="peer sr-only" @if o.Selected {checked}>
          <span class="inline-block px-3 py-1 rounded-full border border-gray-300 dark:border-gray-600 text-sm peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600">@o.Caption</span>
        </label>
        }
      </div>
    </div>

    <div class="mt-7 flex justify-center gap-3">
      <button type="submit" class="px-5 py-2 rounded bg-gray-100 dark:bg-[#303134] hover:ring-1 ring-gray-300 text-sm">@t.searchBtn</button>
      <button type="button" hx-get="/lucky" hx-target="#modal" class="px-5 py-2 rounded bg-gray-100 dark:bg-[#303134] hover:ring-1 ring-gray-300 text-sm">@t.luckyBtn</button>
    </div>
  </form>

  <div class="mt-10 text-center">
    <p class="text-sm text-gray-500 mb-2">@t.popularSearches</p>
    <div class="flex flex-wrap justify-center gap-2">
      @ForEach (var p in Model.Popular) {
      <a href="/search?q=@p.Text" class="px-3 py-1 rounded-full bg-gray-100 dark:bg-gray-800 text-sm hover:bg-emerald-50 dark:hover:bg-emerald-900/40">@p.Text</a>
      }
    </div>
  </div>

  <div class="mt-10 grid grid-cols-2 sm:grid-cols-4 gap-3 w-full">
    @ForEach (var c in Model.CategoryOptions) {
    <a href="/search?category=@c.Value" class="rounded-xl border border-gray-200 dark:border-gray-700 p-3 text-sm text-center hover:border-emerald-500">@c.Caption</a>
    }
  </div>

  <p class="mt-8 text-xs text-gray-400">@t.keyboardHint · <span title="@t.autoXSystemTooltipActive">cx → ĉ</span></p>
</section>
