@LayoutPage layout.html
<section class="max-w-4xl mx-auto w-full px-4 py-8">
  <div class="flex flex-wrap items-center gap-3 mb-6">
    <h1 class="text-2xl font-semibold flex-1">⭐ @t.savedResources</h1>
    <a href="/bookmarks/export" hx-boost="false" class="px-4 py-2 rounded-full border border-gray-300 dark:border-gray-600 text-sm">⬇ @t.exportJsonBtn</a>
    @if Model.HasResults {
    <button type="button" hx-post="/bookmarks/clear" hx-confirm="@t.clearSaved?" class="px-4 py-2 rounded-full border border-red-300 text-red-600 text-sm">🗑 @t.clearSaved</button>
    }
  </div>
  <p class="text-sm text-gray-500 mb-4">@Model.Stats</p>

  @if Model.HasResults {
  <ol id="cards" class="space-y-7">
    @Import _cards.html
  </ol>
  }
  @else {
  <p class="py-10 text-gray-600 dark:text-gray-400">@t.noSavedYet</p>
  }
</section>
