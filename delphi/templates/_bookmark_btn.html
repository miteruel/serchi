<button type="button" hx-post="/bookmark?id=@Model.Id" hx-swap="outerHTML"
        title="@if Model.Saved {@t.removeFromFavorites} @else {@t.saveToFavorites}"
        class="px-2 py-1 rounded hover:bg-gray-100 dark:hover:bg-gray-800 @if Model.Saved {text-amber-500} @else {text-gray-400}">@if Model.Saved {★} @else {☆}</button>
