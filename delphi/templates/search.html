@LayoutPage layout.html
<section class="border-b border-gray-200 dark:border-gray-700">
  <form id="searchform" action="/search" method="get"
        hx-get="/search" hx-target="#results" hx-push-url="true" hx-indicator="#spinner"
        hx-trigger="submit, change, input changed delay:400ms from:#q"
        class="max-w-6xl mx-auto px-4 pt-4 pb-3">
    <div class="flex items-center gap-3">
      <div class="flex-1 flex items-center rounded-full border border-gray-300 dark:border-gray-600 dark:bg-[#303134] px-4 py-2 shadow-sm focus-within:shadow-md">
        <span class="text-gray-400 mr-2">🔎</span>
        <input id="q" type="search" name="q" value="@Model.Query" data-xsystem autocomplete="off"
               placeholder="@t.searchPlaceholder" aria-label="@t.screenReaderSearchInput"
               class="flex-1 bg-transparent outline-none">
        <span id="spinner" class="htmx-indicator ml-2 animate-spin text-emerald-600">◌</span>
      </div>
      <button type="submit" class="hidden sm:block px-4 py-2 rounded-full bg-emerald-600 text-white text-sm font-semibold">@t.searchBtn</button>
    </div>

    @* Category tabs *@
    <div class="mt-3 flex gap-1 overflow-x-auto text-sm">
      @ForEach (var o in Model.CategoryOptions) {
      <label class="cursor-pointer shrink-0">
        <input type="radio" name="category" value="@o.Value" class="peer sr-only" @if o.Selected {checked}>
        <span class="inline-block px-3 py-1.5 border-b-2 border-transparent text-gray-600 dark:text-gray-400 peer-checked:border-emerald-600 peer-checked:text-emerald-700 dark:peer-checked:text-emerald-300 hover:text-gray-900">@o.Caption</span>
      </label>
      }
    </div>

    @* Filters toolbar *@
    <div class="mt-2 flex flex-wrap items-center gap-3 text-sm">
      <select name="level" aria-label="@t.filterByLevel" class="rounded-full border border-gray-300 dark:border-gray-600 bg-transparent px-3 py-1">
        @ForEach (var o in Model.LevelOptions) {
        <option value="@o.Value" @if o.Selected {selected}>@o.Caption</option>
        }
      </select>
      <select name="format" aria-label="@t.filterByFormat" class="rounded-full border border-gray-300 dark:border-gray-600 bg-transparent px-3 py-1">
        @ForEach (var o in Model.FormatOptions) {
        <option value="@o.Value" @if o.Selected {selected}>@o.Caption</option>
        }
      </select>
      <label class="inline-flex items-center gap-1.5">
        <input type="checkbox" name="free" value="1" class="accent-emerald-600" @if Model.FreeOnly {checked}>
        @t.filterFreeOnly
      </label>
      <span class="text-gray-400">|</span>
      <label class="inline-flex items-center gap-1.5">
        @t.sortBy
        <select name="sort" class="rounded-full border border-gray-300 dark:border-gray-600 bg-transparent px-3 py-1">
          @ForEach (var o in Model.SortOptions) {
          <option value="@o.Value" @if o.Selected {selected}>@o.Caption</option>
          }
        </select>
      </label>
      <a href="/search" class="text-emerald-700 dark:text-emerald-300 hover:underline">@t.clearFilters</a>
    </div>

    @* Advanced search (the React version shows it in a modal) *@
    <details class="mt-2 text-sm" @if Model.AdvancedOpen {open}>
      <summary class="cursor-pointer text-gray-600 dark:text-gray-400 select-none">⚙ @t.advancedSearchTitle</summary>
      <div class="mt-2 grid sm:grid-cols-3 gap-3">
        <label class="flex flex-col gap-1">
          <span class="text-xs text-gray-500">@t.exactWordPhrase</span>
          <input type="text" name="exact" value="@Model.ExactPhrase" data-xsystem placeholder="@t.exactPhrasePlaceholder"
                 class="rounded border border-gray-300 dark:border-gray-600 bg-transparent px-2 py-1">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-xs text-gray-500">@t.anyTheseWords</span>
          <input type="text" name="any" value="@Model.AnyWords" data-xsystem placeholder="@t.anyWordsPlaceholder"
                 class="rounded border border-gray-300 dark:border-gray-600 bg-transparent px-2 py-1">
        </label>
        <label class="flex flex-col gap-1">
          <span class="text-xs text-gray-500">@t.noneTheseWords</span>
          <input type="text" name="exclude" value="@Model.ExcludeWords" data-xsystem placeholder="@t.excludeWordsPlaceholder"
                 class="rounded border border-gray-300 dark:border-gray-600 bg-transparent px-2 py-1">
        </label>
      </div>
    </details>
  </form>
</section>

<section id="results" class="max-w-6xl mx-auto w-full px-4 py-4">
  @Import _results.html
</section>
